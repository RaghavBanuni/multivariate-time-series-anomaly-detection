[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msad"
version = "1.0.0"
description = "Multivariate time-series anomaly detection for machine telemetry, standard library only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raghav Banuni" }]
keywords = [
    "anomaly-detection",
    "time-series",
    "mahalanobis",
    "pca",
    "isolation-forest",
    "condition-monitoring",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
msad = "msad.cli:main"

[tool.setuptools]
packages = ["msad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
